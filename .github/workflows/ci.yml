name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # чистая установка по requirements.txt — как у пользователя по README
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      # включает настоящий MCP initialize + tools/list через stdio
      - run: python -m pytest -q tests
